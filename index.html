<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Case Study 1: Facebook Graph API</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #1877f2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #1e293b;
    }

    .card {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      width: 100%;
      max-width: 560px;
      border-radius: 20px;
      padding: 36px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #eff6ff;
      color: #1d4ed8;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 16px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #94a3b8;
      transition: background 0.3s ease;
    }

    .dot.connected {
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }

    h1 {
      font-size: 26px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 26px;
      line-height: 1.5;
    }

    .btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-bottom: 24px;
    }

    button {
      padding: 13px 24px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .btn-fb {
      background: #1877f2;
      color: white;
      box-shadow: 0 4px 14px rgba(24, 119, 242, 0.4);
    }

    .btn-fb:hover {
      background: #166fe5;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(24, 119, 242, 0.5);
    }

    .btn-fb:active {
      transform: translateY(0);
    }

    .btn-logout {
      background: #f1f5f9;
      color: #475569;
      display: none;
    }

    .btn-logout:hover {
      background: #e2e8f0;
      color: #0f172a;
    }

    .profile-preview {
      display: none;
      align-items: center;
      gap: 16px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 20px;
      text-align: left;
    }

    .profile-preview img {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #1877f2;
    }

    .profile-info h2 {
      font-size: 17px;
      color: #0f172a;
      margin-bottom: 2px;
    }

    .profile-info p {
      font-size: 13px;
      color: #64748b;
    }

    .console-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e293b;
      color: #94a3b8;
      padding: 10px 16px;
      border-radius: 12px 12px 0 0;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .console-dots {
      display: flex;
      gap: 6px;
    }

    .console-dots span {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }

    .console-dots span:nth-child(1) { background: #ef4444; }
    .console-dots span:nth-child(2) { background: #eab308; }
    .console-dots span:nth-child(3) { background: #22c55e; }

    pre {
      background: #0f172a;
      color: #38bdf8;
      padding: 18px;
      border-radius: 0 0 12px 12px;
      text-align: left;
      font-family: "Fira Code", Consolas, Monaco, monospace;
      font-size: 13px;
      line-height: 1.6;
      overflow-x: auto;
      max-height: 240px;
    }

    footer {
      margin-top: 20px;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="badge">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">Graph API • Ready</span>
    </div>

    <h1>Facebook Graph API</h1>
    <p class="subtitle">
      Case Study 1: Authenticate with Facebook to query and display live user profile data via the JavaScript SDK.
    </p>

    <div class="btn-group">
      <button class="btn-fb" onclick="loginAndFetch()">
        <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
          <path d="M22.675 0h-21.35c-.732 0-1.325.593-1.325 1.325v21.351c0 .731.593 1.324 1.325 1.324h11.495v-9.294h-3.128v-3.622h3.128v-2.671c0-3.1 1.893-4.788 4.659-4.788 1.325 0 2.463.099 2.795.143v3.24l-1.918.001c-1.504 0-1.795.715-1.795 1.763v2.313h3.587l-.467 3.622h-3.12v9.293h6.116c.73 0 1.323-.593 1.323-1.325v-21.35c0-.732-.593-1.325-1.325-1.325z"/>
        </svg>
        Login & Query Profile
      </button>
      <button class="btn-logout" id="logoutBtn" onclick="logout()">Logout</button>
    </div>

    <!-- Vista previa visual del usuario -->
    <div class="profile-preview" id="profilePreview">
      <img id="userAvatar" src="" alt="Profile Picture">
      <div class="profile-info">
        <h2 id="userName">User Name</h2>
        <p id="userEmail">email@example.com</p>
        <p id="userId" style="font-size: 11px; margin-top: 2px; color: #94a3b8;">ID: ---</p>
      </div>
    </div>

    <!-- Consola de respuesta JSON -->
    <div class="console-header">
      <span>JSON RESPONSE (/me)</span>
      <div class="console-dots">
        <span></span><span></span><span></span>
      </div>
    </div>
    <pre id="output">// Waiting for Facebook Graph API query...</pre>

    <footer>Powered by Facebook JavaScript SDK v19.0</footer>
  </div>

  <script>
    window.fbAsyncInit = function() {
      FB.init({
        appId      : 'PEGA_TU_APP_ID_AQUI', // <-- Reemplaza esto con tu App ID real
        cookie     : true,
        xfbml      : true,
        version    : 'v19.0'
      });
    };

    (function(d, s, id){
      var js, fjs = d.getElementsByTagName(s)[0];
      if (d.getElementById(id)) { return; }
      js = d.createElement(s); js.id = id;
      js.src = "https://connect.facebook.net/en_US/sdk.js";
      fjs.parentNode.insertBefore(js, fjs);
    }(document, 'script', 'facebook-jssdk'));

    function loginAndFetch() {
      document.getElementById('output').textContent = '// Authenticating with Facebook...';
      FB.login(function(response) {
        if (response.authResponse) {
          document.getElementById('statusDot').classList.add('connected');
          document.getElementById('statusText').textContent = 'Graph API • Connected';
          document.getElementById('logoutBtn').style.display = 'inline-flex';

          FB.api('/me', { fields: 'id,name,email,picture.type(large)' }, function(userData) {
            // Mostrar JSON formateado
            document.getElementById('output').textContent = JSON.stringify(userData, null, 2);

            // Mostrar tarjeta visual del perfil
            if (userData && !userData.error) {
              document.getElementById('userName').textContent = userData.name || 'No name';
              document.getElementById('userEmail').textContent = userData.email || 'Email not provided';
              document.getElementById('userId').textContent = 'ID: ' + userData.id;
              if (userData.picture && userData.picture.data) {
                document.getElementById('userAvatar').src = userData.picture.data.url;
              }
              document.getElementById('profilePreview').style.display = 'flex';
            }
          });
        } else {
          document.getElementById('output').textContent = '// Login cancelled or permissions not granted.';
        }
      }, { scope: 'public_profile,email' });
    }

    function logout() {
      FB.logout(function() {
        document.getElementById('statusDot').classList.remove('connected');
        document.getElementById('statusText').textContent = 'Graph API • Disconnected';
        document.getElementById('logoutBtn').style.display = 'none';
        document.getElementById('profilePreview').style.display = 'none';
        document.getElementById('output').textContent = '// Session closed. Waiting for new query...';
      });
    }
  </script>

</body>
</html>
